name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run when new commits are pushed to the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No Supabase/Gemini secrets in CI: pages fall back to sample data at build time.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
